<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conditionals Live Student</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f4ef;color:#222}.app{max-width:720px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:23px;margin:0}.card{background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 8px 28px rgba(0,0,0,.07);min-height:390px}.kind{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px}.question{font-size:21px;line-height:2.2}select{font-size:17px;min-height:46px;border:1px solid #aaa;border-radius:10px;background:#fff;padding:6px 9px;margin:2px 3px;max-width:150px}.source{font-size:16px;font-weight:650;margin-top:22px}.state{margin-top:28px;padding:16px;border-radius:14px;background:#f4f3ef;line-height:1.45}.ok{background:#edf5ed}.locked{background:#f3efe7}.muted{color:#666}.error{color:#a33;font-weight:700}.score{font-size:58px;font-weight:900;margin:18px 0}.version{position:fixed;right:10px;bottom:6px;color:#999;font-size:11px}</style></head><body><div class="app"><div class="top"><h1>First/Second Conditionals Practice</h1><div id="sessionMini" class="muted"></div></div><div class="card"><div id="waiting"><div class="kind">Live Practice</div><h2 id="waitTitle">Joining session…</h2><div class="muted" id="waitText">Please keep this page open.</div></div><div id="questionArea" style="display:none"><div class="kind" id="kind"></div><div class="question" id="question"></div><div class="source" id="source"></div><div class="state" id="state"></div></div><div id="result" style="display:none;text-align:center"><div class="kind">Your Results 🎉</div><div class="score" id="score"></div><div class="muted">answers correct</div></div></div></div><div class="version">student live 5 questions</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyAV2qFiLaqUP_Wzn9wePHixfzsYDX5MHzY",authDomain:"conditionals-practice.firebaseapp.com",databaseURL:"https://conditionals-practice-default-rtdb.firebaseio.com",projectId:"conditionals-practice",storageBucket:"conditionals-practice.firebasestorage.app",messagingSenderId:"667166634005",appId:"1:667166634005:web:81cc097b40043ddc045e1c"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),QUESTIONS=[{"title":"Movie Challenge","source":"Field of Dreams (1989)","segments":[["text","“If you "],["blank","build",["build","built"]],["text"," it, he "],["blank","will",["will","would"]],["text"," come.”"]]},{"title":"Speech Challenge 2","source":"Sandra Bullock — Commencement Speech, 2014","segments":[["text","“If you "],["blank","could",["can","could"]],["text"," go back and talk to your younger self, what "],["blank","would",["will","would"]],["text"," you "],["blank","say",["say","said"]],["text","?”"]]},{"title":"Song Challenge 1","source":"Jordan Lane — “If You Don't Mind”","audio":"jordan","segments":[["text","And I "],["blank","will",["will","would"]],["text"," love you if you "],["blank","let",["let","would let"]],["text"," me."],["br"],["text","And I "],["blank","’ll",["’ll","’d"]],["text"," go if you "],["blank","don't",["don't","didn’t"]],["text"," want me."]]},{"title":"Song Challenge 2","source":"Beyoncé — “If I ____ a Boy”","audio":"beyonce","segments":[["text","If I "],["blank","were",["am","was","were"]],["text"," a boy"],["br"],["text","I think I "],["blank","could",["can","could"]],["text"," understand"],["br"],["text","How it feels to love a girl"],["br"],["text","I swear I "],["blank","’d",["’ll","’d"]],["text"," be a better man"]]},{"title":"Song Challenge 3","source":"Lady Gaga & Bruno Mars — “Die With a Smile”","audio":"bruno","segments":[["text","If the world "],["blank","was",["is","was","were"]],["text"," ending"],["br"],["text","I "],["blank","’d",["’ll","’d"]],["text"," wanna be next to you"],["br"],["text","If the party "],["blank","was",["is","was","were"]],["text"," over"],["br"],["text","And our time on Earth "],["blank","was",["is","was","were"]],["text"," through"],["br"],["text","I "],["blank","’d",["’ll","’d"]],["text"," wanna hold you just for a while"],["br"],["text","And die with a smile"]]}],$=id=>document.getElementById(id);const session=new URLSearchParams(location.search).get('session');let sessionRef=null,current=0,locked=false;
function pid(){let x=localStorage.getItem('conditionalsParticipantId');if(!x){x='p_'+crypto.randomUUID().replaceAll('-','').slice(0,16);localStorage.setItem('conditionalsParticipantId',x)}return x}const participant=pid();
if(!session){$('waitTitle').textContent='No live session found';$('waitText').textContent='Please scan the QR code on the presenter screen.'}else start();
async function start(){try{$('sessionMini').textContent='Session '+session;sessionRef=db.ref('sessions/'+session);const snap=await sessionRef.once('value');if(!snap.exists())throw new Error('This session does not exist.');await sessionRef.child('participants/'+participant).set({joinedAt:firebase.database.ServerValue.TIMESTAMP});sessionRef.child('participants/'+participant).onDisconnect().remove();sessionRef.on('value',s=>sync(s.val()||{}))}catch(e){$('waitTitle').textContent='Could not join';$('waitText').innerHTML='<span class="error">'+e.message+'</span>'}}
async function sync(v){if(v.status==='finished'){showResult(v);return}const qn=Number(v.currentQuestion||0);if(!qn||v.status==='lobby'){$('waiting').style.display='block';$('questionArea').style.display='none';$('result').style.display='none';$('waitTitle').textContent='You’re in!';$('waitText').textContent='Waiting for the presenter to start…';return}if(qn!==current){current=qn;await renderQuestion()}locked=!!(v.locked&&v.locked['q'+current])||v.status==='revealed';document.querySelectorAll('select').forEach(x=>x.disabled=locked);if(locked){$('state').className='state locked';$('state').innerHTML='🔒 Answers are locked. <b>Look at the screen.</b>'}else updateState()}
async function renderQuestion(){$('waiting').style.display='none';$('result').style.display='none';$('questionArea').style.display='block';const q=QUESTIONS[current-1];$('kind').textContent=q.title;$('source').textContent='— '+q.source;$('question').innerHTML='';let n=0;q.segments.forEach(seg=>{if(seg[0]==='text')$('question').append(document.createTextNode(seg[1]));else if(seg[0]==='br')$('question').append(document.createElement('br'));else{const s=document.createElement('select');s.dataset.n=n++;s.innerHTML='<option value="">_____</option>'+seg[2].map(o=>'<option value="'+o.replaceAll('&','&amp;').replaceAll('"','&quot;')+'">'+o+'</option>').join('');s.onchange=save;$('question').append(s)}});const saved=await sessionRef.child('answers/q'+current+'/'+participant).once('value');if(saved.exists()){const ch=saved.val().choices||[];document.querySelectorAll('select').forEach((s,i)=>s.value=ch[i]||'')}updateState()}
async function save(){if(locked)return;const choices=[...document.querySelectorAll('select')].map(s=>s.value);await sessionRef.child('answers/q'+current+'/'+participant).set({choices,updatedAt:firebase.database.ServerValue.TIMESTAMP});updateState()}
function updateState(){if(locked)return;const sels=[...document.querySelectorAll('select')],done=sels.length&&sels.every(s=>s.value);$('state').className=done?'state ok':'state';$('state').textContent=done?'Answer saved ✓ You can still change it until the presenter reveals the answer.':'Choose all answers. Your response will save automatically.'}
async function showResult(v){$('waiting').style.display='none';$('questionArea').style.display='none';$('result').style.display='block';let good=0,total=0;for(let i=0;i<QUESTIONS.length;i++){const ans=QUESTIONS[i].segments.filter(x=>x[0]==='blank').map(x=>x[1]);total+=ans.length;const s=await sessionRef.child('answers/q'+(i+1)+'/'+participant).once('value');const ch=s.exists()?(s.val().choices||[]):[];good+=ans.reduce((a,x,j)=>a+(ch[j]===x?1:0),0)}$('score').textContent=good+' / '+total}
</script></body></html>
