<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conditionals Live Student — Q1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f4ef;color:#222}.app{max-width:720px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:23px;margin:0}.card{background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 8px 28px rgba(0,0,0,.07);min-height:390px}.kind{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px}.question{font-size:21px;line-height:2.2}.studentSelect{font-size:17px;min-height:46px;border:1px solid #aaa;border-radius:10px;background:#fff;padding:6px 9px;margin:2px 3px;max-width:145px}.source{font-size:16px;font-weight:650;margin-top:22px}.state{margin-top:28px;padding:16px;border-radius:14px;background:#f4f3ef;line-height:1.45}.ok{background:#edf5ed}.locked{background:#f3efe7}.error{color:#a33;font-weight:700}.muted{color:#666}.version{position:fixed;right:10px;bottom:6px;color:#999;font-size:11px}</style></head><body><div class="app"><div class="top"><h1>First/Second Conditionals Practice</h1><div id="sessionMini" class="muted"></div></div><div class="card"><div id="waiting"><div class="kind">Live Practice</div><h2 id="waitTitle">Joining session…</h2><div class="muted" id="waitText">Please keep this page open.</div></div><div id="q1" style="display:none"><div class="kind">Movie Challenge</div><div class="question">“If you <select class="studentSelect" id="a1"><option value="">_____</option><option>build</option><option>built</option></select> it, he <select class="studentSelect" id="a2"><option value="">_____</option><option>will</option><option>would</option></select> come.”</div><div class="source">— Field of Dreams (1989)</div><div class="state" id="state">Choose both answers. Your response will save automatically.</div></div></div></div><div class="version">student live Q1</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyAV2qFiLaqUP_Wzn9wePHixfzsYDX5MHzY",authDomain:"conditionals-practice.firebaseapp.com",databaseURL:"https://conditionals-practice-default-rtdb.firebaseio.com",projectId:"conditionals-practice",storageBucket:"conditionals-practice.firebasestorage.app",messagingSenderId:"667166634005",appId:"1:667166634005:web:81cc097b40043ddc045e1c"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),$=id=>document.getElementById(id);const session=new URLSearchParams(location.search).get('session');
function pid(){let x=localStorage.getItem('conditionalsParticipantId');if(!x){x='p_'+crypto.randomUUID().replaceAll('-','').slice(0,16);localStorage.setItem('conditionalsParticipantId',x)}return x}const participant=pid();let locked=false,sessionRef;
if(!session){$('waitTitle').textContent='No live session found';$('waitText').textContent='Please scan the QR code on the presenter screen.'}else{start()}
async function start(){try{$('sessionMini').textContent='Session '+session;sessionRef=db.ref('sessions/'+session);const snap=await sessionRef.once('value');if(!snap.exists())throw new Error('This session does not exist.');await sessionRef.child('participants/'+participant).set({joinedAt:firebase.database.ServerValue.TIMESTAMP});sessionRef.onDisconnect().child('participants/'+participant).remove();const saved=await sessionRef.child('answers/q1/'+participant).once('value');if(saved.exists()){const c=saved.val().choices||[];$('a1').value=c[0]||'';$('a2').value=c[1]||''}sessionRef.on('value',s=>sync(s.val()||{}));$('a1').onchange=save;$('a2').onchange=save}catch(e){$('waitTitle').textContent='Could not join';$('waitText').innerHTML='<span class="error">'+e.message+'</span>'}}
function sync(v){const status=v.status||'lobby';locked=!!(v.locked&&v.locked.q1);if(status==='lobby'){$('waiting').style.display='block';$('q1').style.display='none';$('waitTitle').textContent='You’re in!';$('waitText').textContent='Waiting for the presenter to start…';return}$('waiting').style.display='none';$('q1').style.display='block';$('a1').disabled=locked;$('a2').disabled=locked;if(locked||status==='revealed'){$('state').className='state locked';$('state').innerHTML='🔒 Answers are locked. <b>Look at the screen for the explanation.</b>'}else updateState()}
async function save(){if(locked||!sessionRef)return;const choices=[$('a1').value,$('a2').value];await sessionRef.child('answers/q1/'+participant).set({choices,updatedAt:firebase.database.ServerValue.TIMESTAMP});updateState()}
function updateState(){if(locked)return;const done=$('a1').value&&$('a2').value;$('state').className=done?'state ok':'state';$('state').textContent=done?'Answer saved ✓ You can still change it until the presenter reveals the answer.':'Choose both answers. Your response will save automatically.'}
</script></body></html>
